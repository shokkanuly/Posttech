services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: janamen
      POSTGRES_USER: janamen
      # Local demo only. Set POSTGRES_PASSWORD in .env for anything shared.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janamen_local_only}
    ports:
      # Lets a locally run uvicorn (outside Docker) use the same database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - janamen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janamen -d janamen"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: postgresql+psycopg://janamen:${POSTGRES_PASSWORD:-janamen_local_only}@db:5432/janamen
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      LEAVE_EXCLUDED_DATES: ${LEAVE_EXCLUDED_DATES:-[]}
      MAX_ADVANCE_AMOUNT: ${MAX_ADVANCE_AMOUNT:-1000000}
      REQUEST_HORIZON_DAYS: ${REQUEST_HORIZON_DAYS:-365}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.8}
      AI_PROVIDER: ${AI_PROVIDER:-grounded_knowledge}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ENABLE_MOCK_INTEGRATIONS: "false"
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-262144}
    command: ["sh", "-c", "python -m app.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  janamen_pg:
