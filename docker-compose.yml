services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Password123!}
      SECRET_KEY: ${SECRET_KEY:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: sqlite:////data/janamen.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      AI_PROVIDER: ${AI_PROVIDER:-grounded_knowledge}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      LEAVE_EXCLUDED_DATES: ${LEAVE_EXCLUDED_DATES:-[]}
      MAX_ADVANCE_AMOUNT: ${MAX_ADVANCE_AMOUNT:-1000000}
      REQUEST_HORIZON_DAYS: ${REQUEST_HORIZON_DAYS:-365}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.8}
      ENABLE_MOCK_INTEGRATIONS: "false"
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-262144}
    volumes:
      - janamen_data:/data
    command: ["sh", "-c", "python -m app.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  janamen_data:
