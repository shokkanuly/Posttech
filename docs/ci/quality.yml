name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: janamen_test
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: janamen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janamen_test -d janamen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check app tests migrations smoke_test.py
      - run: python -m mypy app
      - name: Acceptance suite (isolated test databases)
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'postgresql+psycopg://janamen_test:ci-only-disposable-password@127.0.0.1:5432/janamen_test' || '' }}
        run: python -m pytest -q
      - run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: for file in static/js/*.js; do node --check "$file"; done
  mock-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate private isolated MOCK configuration
        run: >-
          python -m app.gateway.configure_mock
          --output "$RUNNER_TEMP/janamen-private.env"
          --project-name janamen-mock-ci
          --web-port 18778 --postgres-port 15448
      - name: Build and start disposable services
        run: >-
          docker compose --env-file "$RUNNER_TEMP/janamen-private.env"
          --profile integrations up --build --wait --wait-timeout 180
      - name: Registration smoke twice without resetting data
        run: |
          for attempt in 1 2; do
            docker compose --env-file "$RUNNER_TEMP/janamen-private.env" exec -T web \
              python -m app.integrations.demo_smoke --scenario ci-repeatable
          done
      - name: Stop owned services and retain volumes
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/janamen-private.env" --profile integrations down
